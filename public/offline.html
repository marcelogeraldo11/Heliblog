<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Estás sin conexión – Heliboss</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; margin: 0; padding: 0; background: #0b0b0c; color: #e5e7eb; display: grid; min-height: 100vh; place-items: center; }
    .card { max-width: 560px; padding: 24px; border-radius: 16px; background: #111827; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0 0 16px; line-height: 1.6; }
    a { color: #93c5fd; text-decoration: none; }
    .muted { color: #9ca3af; font-size: 0.9rem; }
    .btn { display: inline-block; margin-top: 8px; padding: 10px 14px; background: #1f2937; color: #e5e7eb; border-radius: 12px; }
  </style>
</head>
<body>
  <main class="card" role="main" aria-live="polite">
    <h1>Estás sin conexión</h1>
    <p>No pudimos cargar esta página. Verifica tu conexión y vuelve a intentarlo.</p>
    <p class="muted">Puedes regresar al <a href="/">inicio</a> o intentar recargar.</p>
    <a class="btn" href="javascript:location.reload()">Reintentar</a>
  </main>
</body>
</html>
