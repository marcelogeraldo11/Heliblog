<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="droneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:0.8" />
    </linearGradient>
    <radialGradient id="lidarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#00cc66;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#009944;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- LiDAR scanning beams -->
  <g opacity="0.6">
    <line x1="600" y1="250" x2="200" y2="400" stroke="#00ff88" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="250" x2="400" y2="450" stroke="#00ff88" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="250" x2="800" y2="450" stroke="#00ff88" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="250" x2="1000" y2="400" stroke="#00ff88" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Drone body (simplified Matrice 300 RTK) -->
  <g transform="translate(500, 200)">
    <!-- Main body -->
    <ellipse cx="100" cy="50" rx="80" ry="25" fill="url(#droneGradient)" stroke="#cccccc" stroke-width="2"/>
    
    <!-- Arms -->
    <rect x="20" y="35" width="60" height="8" rx="4" fill="url(#droneGradient)"/>
    <rect x="120" y="35" width="60" height="8" rx="4" fill="url(#droneGradient)"/>
    <rect x="20" y="57" width="60" height="8" rx="4" fill="url(#droneGradient)"/>
    <rect x="120" y="57" width="60" height="8" rx="4" fill="url(#droneGradient)"/>
    
    <!-- Propellers -->
    <circle cx="30" cy="25" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 30 25;360 30 25" dur="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="25" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 170 25;-360 170 25" dur="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="75" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 30 75;-360 30 75" dur="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="75" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 170 75;360 170 75" dur="0.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Zenmuse L2 gimbal -->
  <g transform="translate(580, 280)">
    <!-- Gimbal mount -->
    <rect x="0" y="0" width="40" height="30" rx="5" fill="#333333" stroke="#555555" stroke-width="1"/>
    
    <!-- LiDAR sensor -->
    <rect x="5" y="35" width="30" height="40" rx="8" fill="#1a1a1a" stroke="#00ff88" stroke-width="2"/>
    <circle cx="20" cy="55" r="8" fill="url(#lidarGlow)"/>
    
    <!-- Camera -->
    <circle cx="20" cy="25" r="6" fill="#000000" stroke="#ffffff" stroke-width="1"/>
    <circle cx="20" cy="25" r="3" fill="#333333"/>
  </g>
  
  <!-- Point cloud visualization -->
  <g opacity="0.4">
    <circle cx="200" cy="400" r="2" fill="#00ff88">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="220" cy="420" r="2" fill="#00ff88">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="240" cy="440" r="2" fill="#00ff88">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="400" cy="450" r="2" fill="#00ff88">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="800" cy="450" r="2" fill="#00ff88">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="1000" cy="400" r="2" fill="#00ff88">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  
  <!-- Title text -->
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffffff">
    DJI Zenmuse L2
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="160" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#cccccc">
    Sistema LiDAR de Alta Precisión
  </text>
  
  <!-- Technical specs -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="300" height="100" rx="10" fill="rgba(0,0,0,0.6)" stroke="#00ff88" stroke-width="1"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Especificaciones Clave:</text>
    <text x="20" y="45" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">• Precisión: 5cm horizontal, 4cm vertical</text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">• Rango: hasta 500 metros</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">• Tasa: 1.2M puntos/segundo</text>
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">• Cámara: 20MP RGB</text>
  </g>
  
  <!-- DJI Logo placeholder -->
  <g transform="translate(1050, 550)">
    <rect x="0" y="0" width="120" height="40" rx="5" fill="rgba(0,0,0,0.6)"/>
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">DJI</text>
  </g>
</svg>